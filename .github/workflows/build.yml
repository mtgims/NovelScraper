name: Build

# The Windows installer has to be built on Windows: jpackage wraps the platform's
# own runtime and cannot cross-compile. This builds both desktop packages, on the
# machine each one needs, and attaches them to a release when one is tagged.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the installer
        working-directory: app
        shell: pwsh
        # gradlew.bat, not ./gradlew: PowerShell will happily "run" the Unix
        # script and carry on as though a build had happened.
        run: .\gradlew.bat :composeApp:packageExe --no-daemon
      - name: Name it as the app expects
        working-directory: app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter *.exe composeApp/build/compose/binaries | Select-Object -First 1
          if (-not $exe) { throw "no installer was produced" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $exe.FullName artifacts/novelscraper-setup.exe
      - name: Build a version that can report its own failures
        working-directory: app
        shell: pwsh
        run: |
          .\gradlew.bat :composeApp:packageExe -PwinConsole --no-daemon
          $exe = Get-ChildItem -Recurse -Filter *.exe composeApp/build/compose/binaries | Select-Object -First 1
          Copy-Item $exe.FullName artifacts/novelscraper-setup-console.exe
      - uses: actions/upload-artifact@v4
        with:
          name: novelscraper-setup
          path: app/artifacts/*.exe
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME app/artifacts/novelscraper-setup.exe app/artifacts/novelscraper-setup-console.exe --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the AppImage
        working-directory: app
        run: ./gradlew :composeApp:packageLinuxAppImage --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: novelscraper-appimage
          path: novelscraper-x86_64.AppImage
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" novelscraper-x86_64.AppImage --clobber

  # The APK was built by hand on the author's machine and signed with the debug
  # key, which is generated per machine: an APK built anywhere else could not
  # update an existing install, and Android's only way through that is an
  # uninstall, which deletes the reader's library. Building here with a real key
  # fixes both halves.
  #
  # Until the secrets exist this job says so and stops, rather than failing the
  # release or, worse, quietly attaching a debug-signed APK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is a signing key configured?
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No APK built::Set ANDROID_KEYSTORE_BASE64 and its password secrets to have the release APK built and signed here."
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.have == 'true'

      - name: Unpack the keystore
        if: steps.key.outputs.have == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        if: steps.key.outputs.have == 'true'
        working-directory: app
        env:
          NOVELSCRAPER_KEYSTORE: ${{ runner.temp }}/release.jks
          NOVELSCRAPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOVELSCRAPER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOVELSCRAPER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -PrequireReleaseKey=true --no-daemon

      - name: Shred the keystore
        if: always() && steps.key.outputs.have == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.have == 'true'
        with:
          name: novelscraper-apk
          path: novelscraper.apk

      - name: Attach it to the release
        if: steps.key.outputs.have == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" novelscraper.apk --clobber
