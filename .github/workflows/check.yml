name: Check

# The tests and lint CONTRIBUTING.md asks for before calling a change done.
#
# build.yml only packages, and only when a tag is pushed, so until this existed
# the suite in the repository never ran anywhere except on the author's machine.
# A guard that is never exercised is a guard that quietly stops working.
#
# The checks that reach a real site, a real browser or a speech model are opt-in
# behind -P flags and stay off here. CI must not go red because someone else's
# website is down.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run pointless; don't pay for both.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Tests and lint
        working-directory: app
        run: >
          ./gradlew --no-daemon
          :composeApp:desktopTest
          :composeApp:testAndroidHostTest
          :androidApp:lintRelease

      # Gradle prints a summary and little else; the reports say which case
      # failed and why, which is what anyone reading a red run actually needs.
      - name: Reports, if something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-reports
          if-no-files-found: ignore
          path: |
            app/composeApp/build/reports/
            app/composeApp/build/test-results/
            app/androidApp/build/reports/
