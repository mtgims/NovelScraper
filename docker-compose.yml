# NovelScraper — one-command deploy: backend + frontend + Caddy (automatic HTTPS).
# Only Caddy is published (80/443); backend/frontend talk over the internal network.
# See deploy/HOSTING.md for the full Hetzner + Cloudflare runbook.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NOVELSCRAPER_DATA_DIR: /data
      NOVELSCRAPER_ADMIN_USERNAME: ${NOVELSCRAPER_ADMIN_USERNAME:-admin}
      NOVELSCRAPER_ADMIN_PASSWORD: ${NOVELSCRAPER_ADMIN_PASSWORD:?set a strong admin password in .env}
      NOVELSCRAPER_MAX_CACHE_MB: ${NOVELSCRAPER_MAX_CACHE_MB:-500}
      NOVELSCRAPER_MAX_AUDIO_MB: ${NOVELSCRAPER_MAX_AUDIO_MB:-1024}
    volumes:
      - nsdata:/data

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-novelscraper.com}
      ACME_EMAIL: ${ACME_EMAIL:?set your email (for Let's Encrypt) in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  nsdata:
  caddy_data:
  caddy_config:
