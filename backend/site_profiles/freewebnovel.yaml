# freewebnovel.com — the book page's <ul id="idData"> shows only 40 chapters per
# page; the rest are behind a "Next" button that loads ?page=N (each a fresh 40).
# Walk those pages; the paginated enumerator stops when a page is empty. Content
# in div.txt.
name: freewebnovel
base_url: https://freewebnovel.com
enumeration: paginated
book_url_regex: "/novel/(?P<book>[^/?#]+)"
list_url_template: "{base_url}/novel/{book}?page={page}"
list_container_selector: "#idData"
link_selector: "a"
content_selector: ".txt"
strip_selectors:
  - script
  - style
