# Site profile for ranobes.net
# The chapter-list pages (/chapters/{id}/page/N/) are Disallow'd in robots.txt,
# so we can't walk the TOC. Instead follow each chapter's "next" link — those
# content pages are allowed. /chapters/{id}/first redirects to chapter 1.
name: ranobes
base_url: https://ranobes.net
enumeration: next_link
book_url_regex: "/novels/(?P<book>\\d+)"
first_chapter_url_template: "{base_url}/chapters/{book}/first"
next_link_selector: "#next"
content_selector: "#arrticle"
title_selector: "h1.title"
book_author_selector: ".tag_list a"
book_cover_selector: ".r-fullstory-poster img"
# .category + the hidden "|" span are the "| Novel Name" breadcrumb inside the
# chapter <h1>; stripping them leaves just the clean chapter title.
strip_selectors:
  - script
  - style
  - .category
  - span[hidden]
  - ins
  - .ads
