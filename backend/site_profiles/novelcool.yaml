# Site profile for novelcool.com
# The novel page lists every chapter as static <a> links (newest-first), so one
# fetch of the novel page yields the whole table of contents; page 2 repeats it
# and the paginated enumerator stops.
name: novelcool
base_url: https://www.novelcool.com
enumeration: paginated
book_url_regex: "/novel/(?P<book>[^/?#]+)\\.html"
list_url_template: "{base_url}/novel/{book}.html"
list_container_selector: ".chapter-item-list"
link_selector: "a"
chapter_title_selector: ".chapter-item-headtitle"
reverse_chapters: true
content_selector: ".overflow-hidden"
book_title_selector: ".bookinfo-title"
book_author_selector: ".bookinfo-author a"
book_cover_selector: ".bookinfo-pic img"
strip_selectors:
  - script
  - style
  - ins
  - .ads
