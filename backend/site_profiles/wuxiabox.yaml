# wuxiabox.com — chapter list is ul.chapter-list on the book page's ?tab=chapters
# view. NOTE: only the first ~100 chapters are reachable this way (further pages
# load via an AJAX endpoint), so very long novels will be truncated.
name: wuxiabox
base_url: https://wuxiabox.com
enumeration: paginated
book_url_regex: "/novel/(?P<book>[^/?#]+?)\\.html"
list_url_template: "{base_url}/novel/{book}.html?tab=chapters"
list_container_selector: "ul.chapter-list"
link_selector: "a"
chapter_no_selector: "span.chapter-no"
chapter_title_selector: "strong.chapter-title"
content_selector: ".chapter-content"
strip_selectors:
  - script
  - style
