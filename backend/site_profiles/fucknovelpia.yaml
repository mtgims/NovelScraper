# fucknovelpia.com — full chapter list in #chapter-list on the book page
# (chapter links point at /chapter.php?hash=...&ch=NNNN); content in div.reader.
name: fucknovelpia
base_url: https://fucknovelpia.com
enumeration: paginated
book_url_regex: "/novel/(?P<book>[^/?#]+)"
list_url_template: "{base_url}/novel/{book}"
list_container_selector: "#chapter-list"
link_selector: "a"
chapter_title_selector: "span.chapter-item-main"
content_selector: ".reader"
book_title_selector: "h1"
strip_selectors:
  - script
  - style
